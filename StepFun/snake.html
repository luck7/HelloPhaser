<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Phaser 贪吃蛇</title>
<script src="phaser.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 0%, #1e293b, #020617 70%);
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 20px; letter-spacing: 3px; margin: 0; font-weight: 600; color: #86efac; }
  #game {
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);
    touch-action: none;
  }
  .tips { font-size: 13px; color: #94a3b8; text-align: center; line-height: 1.8; margin: 0; }
  kbd {
    background: #1e293b; border: 1px solid #334155; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-size: 12px; color: #cbd5e1;
  }
</style>
</head>
<body>

<h1>PHASER 贪吃蛇</h1>
<div id="game"></div>
<p class="tips">
  <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 转向 ·
  <kbd>空格</kbd> 开始 / 暂停 / 重来<br>
  手机端：在棋盘上滑动手指即可转向
</p>

<script>
/* ============================================================
   基础配置：棋盘是一张 20 x 20 的方格纸，每格 24 像素
   ============================================================ */
const CELL = 24;          // 每格像素
const COLS = 20;          // 列数
const ROWS = 20;          // 行数
const TOP  = 64;          // 顶部信息栏高度
const W = COLS * CELL;    // 棋盘宽 480
const H = ROWS * CELL;    // 棋盘高 480

/* ---------- 一个极简的“音效合成器”（无需任何音频文件） ---------- */
let audioCtx = null;
function beep(freq, dur = 0.08, type = 'square', vol = 0.06) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) { /* 浏览器不支持就静默忽略 */ }
}

/* ============================================================
   主场景 Scene —— 游戏里的一切都发生在这里
   ============================================================ */
class SnakeScene extends Phaser.Scene {
  constructor() {
    super('SnakeScene');
  }

  create() {
    /* ---------- 1. 状态数据（蛇、方向、分数） ---------- */
    this.state = 'ready';            // ready | playing | paused | over | win
    this.snake = [{ x: 10, y: 10 }]; // 蛇身，索引 0 是蛇头
    this.direction = { x: 1, y: 0 }; // 当前前进方向
    this.turnQueue = [];             // 转向指令缓冲区
    this.moveInterval = 130;         // 每走一步的毫秒数（越小越快）
    this.acc = 0;                    // 时间累加器
    this.score = 0;
    this.food = { x: 15, y: 10 };
    this.highScore = this.loadHighScore();

    /* ---------- 2. 画笔 Graphics：棋盘和蛇都由它“擦掉重画” ---------- */
    this.gfx = this.add.graphics();

    /* ---------- 3. 顶部信息栏 ---------- */
    this.add.text(16, 20, 'SCORE', { fontFamily: 'monospace', fontSize: '14px', color: '#64748b' });
    this.scoreText = this.add.text(16, 34, '0', { fontFamily: 'monospace', fontSize: '26px', color: '#86efac' });
    this.add.text(W - 16, 20, 'HIGH', { fontFamily: 'monospace', fontSize: '14px', color: '#64748b' })
      .setOrigin(1, 0);
    this.highText = this.add.text(W - 16, 34, String(this.highScore),
      { fontFamily: 'monospace', fontSize: '26px', color: '#fbbf24' }).setOrigin(1, 0);
    this.speedText = this.add.text(W / 2, 40, 'LV.1',
      { fontFamily: 'monospace', fontSize: '16px', color: '#38bdf8' }).setOrigin(0.5, 0.5);

    /* ---------- 4. 食物：一个会呼吸的红色方块 ---------- */
    this.foodGlow = this.add.rectangle(0, 0, CELL + 8, CELL + 8, 0xf87171, 0.22);
    this.foodBox  = this.add.rectangle(0, 0, CELL - 6, CELL - 6, 0xef4444)
      .setStrokeStyle(2, 0xfca5a5);
    this.foodContainer = this.add.container(0, 0, [this.foodGlow, this.foodBox]);

    /* ---------- 5. 覆盖层：开始 / 暂停 / 结束 提示 ---------- */
    this.overlay = this.add.graphics();
    this.titleText = this.add.text(W / 2, H / 2 + TOP - 30, '', {
      fontFamily: 'monospace', fontSize: '40px', color: '#ffffff'
    }).setOrigin(0.5);
    this.subText = this.add.text(W / 2, H / 2 + TOP + 24, '', {
      fontFamily: 'monospace', fontSize: '16px', color: '#94a3b8'
    }).setOrigin(0.5);
    this.hintText = this.add.text(W / 2, H / 2 + TOP + 60, '', {
      fontFamily: 'monospace', fontSize: '14px', color: '#86efac'
    }).setOrigin(0.5);

    this.placeFood();
    this.showOverlay('SNAKE', '吃掉红点，别撞墙也别咬到自己', '按 空格 或 点击屏幕 开始');
    this.draw();

    /* ---------- 6. 输入：键盘 + 触屏滑动 ---------- */
    const cursors = this.input.keyboard.createCursorKeys();
    const wasd = this.input.keyboard.addKeys('W,A,S,D');
    this.input.keyboard.addCapture('UP,DOWN,LEFT,RIGHT,SPACE');

    const bind = (key, dir) => key.on('down', () => this.turn(dir));
    bind(cursors.up,    { x: 0,  y: -1 });
    bind(cursors.down,  { x: 0,  y: 1  });
    bind(cursors.left,  { x: -1, y: 0  });
    bind(cursors.right, { x: 1,  y: 0  });
    bind(wasd.W, { x: 0,  y: -1 });
    bind(wasd.S, { x: 0,  y: 1  });
    bind(wasd.A, { x: -1, y: 0  });
    bind(wasd.D, { x: 1,  y: 0  });

    this.input.keyboard.on('keydown-SPACE', () => this.onConfirm());
    this.input.on('pointerup', (p) => {
      const dx = p.upX - p.downX;
      const dy = p.upY - p.downY;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { this.onConfirm(); return; }
      if (Math.abs(dx) > Math.abs(dy)) this.turn({ x: dx > 0 ? 1 : -1, y: 0 });
      else                             this.turn({ x: 0, y: dy > 0 ? 1 : -1 });
    });
  }

  /* ---------- 工具：读取 / 保存最高分 ---------- */
  loadHighScore() {
    try { return parseInt(localStorage.getItem('phaser-snake-high') || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  saveHighScore() {
    try { localStorage.setItem('phaser-snake-high', String(this.highScore)); } catch (e) {}
  }

  /* ---------- 转向指令：排队，避免一帧内连按丢失 ---------- */
  turn(dir) {
    if (this.state !== 'playing') return;
    const last = this.turnQueue.length ? this.turnQueue[this.turnQueue.length - 1] : this.direction;
    if (dir.x === -last.x && dir.y === -last.y) return; // 禁止 180° 掉头
    if (dir.x === last.x && dir.y === last.y) return;   // 同方向无意义
    if (this.turnQueue.length < 2) this.turnQueue.push(dir);
  }

  /* ---------- 空格 / 点击：开始、暂停、重开 ---------- */
  onConfirm() {
    if (this.state === 'ready') {
      this.state = 'playing';
      this.hideOverlay();
    } else if (this.state === 'playing') {
      this.state = 'paused';
      this.showOverlay('PAUSED', '游戏已暂停', '按 空格 继续');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      this.hideOverlay();
    } else if (this.state === 'over' || this.state === 'win') {
      if (this.time.now - this.overAt > 350) this.scene.restart();
    }
  }

  /* ---------- 在空格子里随机放食物 ---------- */
  placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!this.snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    if (!free.length) { this.winGame(); return; }
    this.food = Phaser.Utils.Array.GetRandom(free);
    this.foodContainer.setPosition(
      this.food.x * CELL + CELL / 2,
      this.food.y * CELL + CELL / 2 + TOP
    );
    this.tweens.killTweensOf(this.foodContainer);
    this.foodContainer.setScale(1);
    this.tweens.add({
      targets: this.foodContainer,
      scale: { from: 0.78, to: 1.1 },
      duration: 560,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });
  }

  /* ---------- 核心：走一步 ---------- */
  step() {
    if (this.turnQueue.length) this.direction = this.turnQueue.shift();

    const head = this.snake[0];
    const nx = head.x + this.direction.x;
    const ny = head.y + this.direction.y;

    // 撞墙
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return this.gameOver();
    // 咬到自己（尾巴这一格会移开，所以不算）
    for (let i = 0; i < this.snake.length - 1; i++) {
      if (this.snake[i].x === nx && this.snake[i].y === ny) return this.gameOver();
    }

    this.snake.unshift({ x: nx, y: ny });

    if (nx === this.food.x && ny === this.food.y) {
      /* --- 吃到：加分、加速、长身体 --- */
      this.score += 10;
      this.scoreText.setText(String(this.score));
      this.moveInterval = Math.max(60, this.moveInterval - 3);
      this.speedText.setText('LV.' + (Math.floor((130 - this.moveInterval) / 10) + 1));
      beep(660 + this.score * 2, 0.07, 'square');
      this.popEffect(nx, ny);
      this.placeFood();
    } else {
      this.snake.pop(); // 没吃到就把尾巴收回，保持长度
    }
  }

  /* ---------- 吃到食物时炸开一圈小粒子 ---------- */
  popEffect(gx, gy) {
    const cx = gx * CELL + CELL / 2;
    const cy = gy * CELL + CELL / 2 + TOP;
    for (let i = 0; i < 8; i++) {
      const p = this.add.circle(cx, cy, 3, 0xfca5a5);
      const a = (Math.PI * 2 / 8) * i + Math.random() * 0.5;
      this.tweens.add({
        targets: p,
        x: cx + Math.cos(a) * 30,
        y: cy + Math.sin(a) * 30,
        alpha: 0,
        scale: 0,
        duration: 380,
        ease: 'Cubic.easeOut',
        onComplete: () => p.destroy()
      });
    }
  }

  /* ---------- 结束 / 胜利 ---------- */
  gameOver() {
    this.state = 'over';
    this.overAt = this.time.now;
    beep(200, 0.18, 'sawtooth', 0.08);
    setTimeout(() => beep(120, 0.28, 'sawtooth', 0.08), 130);
    if (this.score > this.highScore) {
      this.highScore = this.score;
      this.saveHighScore();
      this.highText.setText(String(this.highScore));
    }
    this.showOverlay('GAME OVER', '本局得分 ' + this.score, '按 空格 或 点击 重新开始');
  }

  winGame() {
    this.state = 'win';
    this.overAt = this.time.now;
    this.showOverlay('YOU WIN!', '你填满了整个棋盘！得分 ' + this.score, '按 空格 再来一局');
  }

  /* ---------- 覆盖层显隐 ---------- */
  showOverlay(title, sub, hint) {
    this.overlay.clear();
    this.overlay.fillStyle(0x020617, 0.78);
    this.overlay.fillRect(0, TOP, W, H);
    this.titleText.setText(title).setVisible(true);
    this.subText.setText(sub).setVisible(true);
    this.hintText.setText(hint).setVisible(true);
  }
  hideOverlay() {
    this.overlay.clear();
    this.titleText.setVisible(false);
    this.subText.setVisible(false);
    this.hintText.setVisible(false);
  }

  /* ============================================================
     游戏主循环：每帧被调用一次（约 60 次/秒）
     ============================================================ */
  update(time, delta) {
    if (this.state === 'playing') {
      this.acc += delta;                       // 沙漏累加时间
      while (this.acc >= this.moveInterval) {  // 满了就前进一步
        this.acc -= this.moveInterval;
        this.step();
      }
    }
    if (this.state === 'ready' || this.state === 'over' || this.state === 'win') {
      this.hintText.setVisible(Math.floor(time / 420) % 2 === 0);
    }
    this.draw();
  }

  /* ---------- 渲染：把当前数据“画”到屏幕上 ---------- */
  draw() {
    const g = this.gfx;
    g.clear();

    // 棋盘底色 + 棋格
    g.fillStyle(0x0f172a, 1);
    g.fillRect(0, TOP, W, H);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) {
          g.fillStyle(0x16213a, 1);
          g.fillRect(x * CELL, y * CELL + TOP, CELL, CELL);
        }
      }
    }

    // 蛇身：从头部亮绿色渐变到尾部深绿色
    const n = this.snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = this.snake[i];
      const t = n === 1 ? 0 : i / (n - 1);
      const col = Phaser.Display.Color.Interpolate.ColorWithColor(
        new Phaser.Display.Color(190, 242, 100),
        new Phaser.Display.Color(22, 101, 52),
        100, t * 100
      );
      g.fillStyle(Phaser.Display.Color.GetColor(col.r, col.g, col.b), 1);
      const pad = i === 0 ? 1 : 2;
      g.fillRoundedRect(
        s.x * CELL + pad, s.y * CELL + TOP + pad,
        CELL - pad * 2, CELL - pad * 2,
        i === 0 ? 8 : 6
      );
    }

    // 蛇头上的眼睛（永远朝着前进方向）
    const head = this.snake[0];
    const d = this.direction;
    const px = -d.y, py = d.x;                 // 垂直方向的向量
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2 + TOP;
    const off = 4.6;
    const eyes = [
      { x: cx + d.x * off + px * off, y: cy + d.y * off + py * off },
      { x: cx + d.x * off - px * off, y: cy + d.y * off - py * off }
    ];
    eyes.forEach(e => {
      g.fillStyle(0xffffff, 1); g.fillCircle(e.x, e.y, 3.4);
      g.fillStyle(0x0f172a, 1); g.fillCircle(e.x + d.x * 1.3, e.y + d.y * 1.3, 1.7);
    });

    // 棋盘外框
    g.lineStyle(2, 0x334155, 1);
    g.strokeRect(1, TOP + 1, W - 2, H - 2);
  }
}

/* ============================================================
   启动游戏
   ============================================================ */
new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W,
  height: H + TOP,
  backgroundColor: '#0b1120',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [SnakeScene]
});
</script>

</body>
</html>
