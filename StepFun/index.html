<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StepFun · Phaser 小游戏合集</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1e293b, #020617 70%);
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 48px 24px 64px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: 30px; letter-spacing: 6px; margin: 0 0 10px; font-weight: 700; color: #86efac; }
  .sub { color: #94a3b8; font-size: 14px; letter-spacing: 1px; }
  .phaser-box {
    background: rgba(15, 23, 42, .6);
    border: 1px solid rgba(148, 163, 184, .15);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 36px;
    line-height: 1.8;
    color: #cbd5e1;
    font-size: 14px;
  }
  .phaser-box b { color: #86efac; }
  .phaser-box a { color: #93c5fd; }
  h2 {
    font-size: 18px;
    letter-spacing: 3px;
    margin: 0 0 18px;
    color: #f1f5f9;
    border-left: 4px solid #86efac;
    padding-left: 12px;
  }
  /* 卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(30, 41, 59, .6);
    border: 1px solid rgba(148, 163, 184, .15);
    border-radius: 14px;
    padding: 18px 20px;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #86efac;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
  }
  .card .name { font-size: 17px; font-weight: 600; color: #f1f5f9; margin-bottom: 6px; }
  .card .file { font-size: 12px; color: #64748b; margin-bottom: 10px; font-family: ui-monospace, Consolas, monospace; }
  .card .desc { font-size: 13px; color: #94a3b8; line-height: 1.7; }
  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 12px;
    color: #475569;
  }
  footer a { color: #64748b; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>STEPFUN · 阶跃星辰</h1>
    <p class="sub">Phaser 3 小游戏合集</p>
  </header>

  <section class="phaser-box">
    本项目所有小游戏均基于 <b>Phaser 3</b> 开发。
    Phaser 是一个开源、轻量的 HTML5 2D 游戏框架，项目根目录已内置 <code>phaser.min.js</code>，
    各游戏通过相对路径直接引用，<b>无需联网或安装依赖</b>，点击下方卡片即可开始游玩。
  </section>

  <h2>游戏列表</h2>
  <div class="grid" id="grid"></div>

  <footer>
    来源：<a href="https://studio.stepfun.com/" target="_blank">AI Studio · studio.stepfun.com</a>
  </footer>
</div>

<script>
  // 游戏数据：与 README.md 保持一致，集中管理便于维护
  const games = [
    { name: '跳棋',       file: 'checkers.html',   desc: '经典西洋跳棋（Checkers），支持走子与吃子规则。' },
    { name: '国际象棋',   file: 'chess.html',      desc: '国际象棋，支持双人对战与人机对战。' },
    { name: '围棋',       file: 'go-weiqi.html',   desc: '围棋（Weiqi），在棋盘上进行对弈。' },
    { name: '数独',       file: 'sudoku.html',     desc: '数独益智游戏，填写数字使行列及宫内不重复。' },
    { name: '中国象棋',   file: 'xiangqi.html',    desc: '中国象棋，支持人机对战。' },
    { name: '贪吃蛇',     file: 'snake.html',      desc: '经典贪吃蛇，控制蛇吃食物并不断成长。' },
    { name: '俄罗斯方块', file: 'tetris.html',     desc: '俄罗斯方块，方块下落、旋转、消行。' },
    { name: '军旗',       file: 'junqi.html',      desc: '网页军旗，暗棋规则的军旗对战。' },
    { name: '五子棋',     file: 'gomoku.html',     desc: '五子棋，支持人机对战，先连成五子者胜。' },
    { name: '坦克大战',   file: 'tank-battle.html',desc: '坦克大战，操控坦克消灭敌方并保卫基地。' },
  ];

  // 数据驱动渲染卡片，避免重复的 HTML 结构
  const grid = document.getElementById('grid');
  grid.innerHTML = games.map(g => `
    <a class="card" href="./${g.file}">
      <div class="name">${g.name}</div>
      <div class="file">${g.file}</div>
      <div class="desc">${g.desc}</div>
    </a>
  `).join('');
</script>
</body>
</html>
